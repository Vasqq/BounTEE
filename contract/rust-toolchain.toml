# NEAR contracts must build with rustc <= 1.86: newer compilers emit WebAssembly features
# the NEAR runtime refuses. Separate from the judge's toolchain in ../rust-toolchain.toml;
# run cargo from this directory so rustup picks this file.
[toolchain]
channel = "1.86.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
