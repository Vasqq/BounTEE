# The bounty contract's own workspace, pinned by contract/rust-toolchain.toml to rustc 1.86
# for a stable build (not a NEAR limit).
# resolver 3 picks the newest dependency versions that still support rust-version 1.86.
[workspace]
resolver = "3"
members = [".", "tests/stand-ins/test-outlayer", "tests/stand-ins/test-mpc", "tests/stand-ins/test-usdc"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Vasqq/bountee"
rust-version = "1.86"

[workspace.dependencies]
near-sdk = "5"
near-contract-standards = "5"

[package]
name = "bountee-contract"
version = "0.1.0"
description = "BounTEE's keyless bounty contract on NEAR"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The reproducible build (R15.2): `cargo near build reproducible-wasm` builds the committed
# tree in this pinned image, so anyone rebuilds the code hash a deployment shows, and records
# the image, command and commit in the contract's NEP-330 `contract_source_metadata`.
# `bountee build` runs it (with the judge's own pinned build) for any commit.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.20.3-rust-1.86.0"
image_digest = "sha256:a84b7c401a856b6bbbe1975f235b6a8011540a24dfbde248531cccb4b2fdbadf"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
# `unstable` for env::ecrecover, the host function that checks and derives pause keys.
near-sdk = { workspace = true, features = ["unstable"] }
bountee-formats = { path = "../formats", default-features = false, features = ["near"] }
# Scalar arithmetic only (mod the secp256k1 order); point arithmetic runs in ecrecover.
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
bountee-formats = { path = "../formats", features = ["near", "pause-role"] }
k256 = { version = "0.13", features = ["ecdsa"] }
bs58 = "0.5"
hex = "0.4"
sha2 = "0.10"
near-workspaces = { version = ">=0.18, <0.25", features = ["unstable"] }
# The sandbox node near-workspaces runs, started directly by the tests that let days pass (#23).
near-sandbox = "0.3.16"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
