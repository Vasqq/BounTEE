# Damn Vulnerable DeFi v4 levels for BounTEE (ticket #27). Its own project because DVD pins
# solc =0.8.25; the compiler settings follow DVD v4.1.0's own foundry.toml.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./builds/uniswap/" }]

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[dependencies]
forge-std = "1.9.7"
"@openzeppelin-contracts" = "5.2.0"
solady = "0.0.221"
solmate = "89365b880c4f3c786bdd453d4b8e8fe410344a69"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_location = "txt"
recursive_deps = false
