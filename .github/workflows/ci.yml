name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same suites `pnpm test` runs locally (scripts/test-all.sh).
        suite: [formats, j, c, t, w, e]
    steps:
      - uses: actions/checkout@v4

      # rustup installs each toolchain on first use from rust-toolchain.toml
      # (repo root: formats + judge; contract/: the bounty contract).
      - name: Rust caches
        if: contains(fromJSON('["formats","j","c","t"]'), matrix.suite)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            contract -> target

      # Seam T runs the compiled judge under wasmtime too (`bountee test`, `rerun`).
      - name: wasmtime
        if: contains(fromJSON('["j","t"]'), matrix.suite)
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "v50.0.1"

      # Seam C builds the contract with `cargo near` (near-workspaces' compile_project), at the
      # version contract/rust-toolchain.toml pins. The release tarball is checked against a
      # hash pinned here, not one fetched from the same release.
      - name: cargo-near
        if: matrix.suite == 'c'
        env:
          CARGO_NEAR_VERSION: "0.20.3"
          CARGO_NEAR_SHA256: "1777e0595db7ed81c926cd68ce262580b65efa691195349424193cb350774dcb"
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo cargo-near.tar.gz \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  cargo-near.tar.gz" | sha256sum -c -
          tar xzf cargo-near.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" cargo-near-x86_64-unknown-linux-gnu/cargo-near
          rm cargo-near.tar.gz
          cargo near --version

      # Seam T drives forge, anvil and cast as a Whitehat's machine does; seam C checks the
      # contract's pause transactions with cast, an EVM decoder independent of its own.
      - name: Foundry
        if: contains(fromJSON('["c","e","t"]'), matrix.suite)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Playwright browser
        if: matrix.suite == 'w'
        run: pnpm --filter @bountee/web exec playwright install --with-deps chromium

      # The offline tests (D19) deny themselves the network with `unshare --user --net`, which
      # Ubuntu 24.04's AppArmor refuses to unprivileged users. Allow it here; where no sandbox
      # works, cli/test/offline.ts fails the tests rather than run them with the network on.
      - name: Network sandbox for the offline tests
        if: matrix.suite == 't'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net true

      - name: Test ${{ matrix.suite }}
        run: bash scripts/test-all.sh ${{ matrix.suite }}
